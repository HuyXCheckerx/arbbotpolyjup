[workspace]
members = [
  "rust/crates/jupol-domain",
  "rust/crates/jupol-http",
  "rust/crates/jupol-jupiter",
  "rust/crates/jupol-live",
  "rust/crates/jupol-polymarket",
  "rust/crates/jupol-runtime",
  "rust/crates/jupol-scanner",
  "rust/crates/jupol-solana",
  "rust/crates/jupol-state",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
float_arithmetic = "deny"

[workspace.dependencies]
alloy = { version = "=1.6.3", features = ["essentials"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
dotenvy = "0.15.7"
ethers = { version = "2.0.14", default-features = false, features = ["rustls"] }
futures = "0.3.31"
hex = "0.4.3"
polymarket_client_sdk_v2 = { version = "0.7.0", features = ["clob", "ctf", "gamma", "rtds", "ws"] }
rs-builder-relayer-client = "0.2.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
solana-sdk = "3.0.0"
solana-instruction = "3.1.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.bench]
codegen-units = 1
lto = "fat"
